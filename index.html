      <main style="max-width: 400px; margin: 11vh auto; padding: 1rem; font-family: system-ui, sans-serif">
        <h1>가계부 (kakebu)</h1>
        <p>
          kakebu(가계부)는 두 사람이 함께 쓰는 개인용 가계부 웹앱이에요. 월별 수입·지출을 입력하면

        </p>

          별도 서버로 데이터를 보내지 않아요.
        </p>
